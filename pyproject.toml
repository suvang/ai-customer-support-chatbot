[project]
name = "store-support"
version = "0.1.0"
description = "Store support assistant: policy from Support documents, facts from one Order record."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "langchain-text-splitters>=0.3",
  "langchain-openai>=0.3",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "mypy>=1.13"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
store_support = ["static/*", "sample_docs/*"]

[tool.mypy]
python_version = "3.11"
packages = ["store_support"]
mypy_path = "src"
strict = true
